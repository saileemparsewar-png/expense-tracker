services:
  - type: web
    name: expense-tracker
    env: node
    buildCommand: cd server && npm install && cd ../client && npm install && npm run build
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DB_PATH
        value: /var/data/expenses.db
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
